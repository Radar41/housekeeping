[paths]
home = "/home/radar-41-0"
layout = "/home/radar-41-0/LAYOUT.md"
logs = "logs"

[atlas]
dsn_env = "ATLAS_DSN"

[mover]
moves_log = "logs/moves.tsv"
quarantine = "/home/radar-41-0/quarantine"
protected_dir = "/home/radar-41-0/protected"
write_provenance = true

[checker]
protected_names_file = "/home/radar-41-0/projects/housekeeping/protected_names.txt"

[intake]
machine = "winbox"
target_root = "/home/radar-41-0/inbox"
# Each source is {name, remote}; copies land in <target_root>/<machine>/<name>/.
# Remotes are made by hand with rclone config on radar-41. Example:
# sources = [{ name = "c", remote = "winbox-c:/" }, { name = "cloud", remote = "cloud-remote:/" }]
sources = []

[atlas_queries]
log = "logs/atlas_queries.tsv"
default_format = "tsv"
[router]
host = "0.0.0.0"
port = 8000
log = "logs/router.tsv"
health_interval_s = 10
health_timeout_s = 3

[router.overflow_inflight]
reader = 4
coder = 2

[router.roles.embedder]
url = "http://localhost:8101"
model = "embedder-model"
timeout_s = 30

[router.roles.reader]
url = "http://localhost:8102"
model = "reader-model"
timeout_s = 120

[router.roles.coder]
url = "http://localhost:8103"
model = "coder-model"
timeout_s = 300

[router.andromeda]
url = "http://andromeda:8000"
roles_allowed = ["reader", "coder"]
enabled = false

# Optional. Holds a reader/coder request until hk sched reports that role's GPU free
# (processes/09-scheduler.md). Leave the table out, or enabled = false, to forward at once.
[router.gate]
enabled = true
state_file = "/home/radar-41-0/data/housekeeping/sched/state.json"
wait_s = 180        # longest a request waits for an embedding job to leave the GPU
stale_s = 60        # state older than this means hk sched is down: forward without waiting
poll_s = 1

[sched]
router_url = "http://127.0.0.1:8000"
state_file = "/home/radar-41-0/data/housekeeping/sched/state.json"
claims_file = "/home/radar-41-0/data/housekeeping/sched/claims.json"
log = "logs/sched.tsv"
tick_s = 5
idle_release_s = 900          # embedding resumes after this long with no requests for the role
embed_job_prefix = "atlas-fo" # job name prefix of the Atlas embedding slices (squeue -o '%i %j')
unload_before_release = true  # unload the node's Ollama models before embedding takes the GPU back

[sched.nodes]                 # role -> Slurm node its Ollama shares a GPU with
coder = "node-a"
reader = "node-b"
