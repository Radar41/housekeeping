[project]
name = "housekeeping"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
hk = "housekeeping.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housekeeping"]
